name: Verify Cabinet 234 publication

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public contract and downloads
        run: |
          python scripts/validate_catalog.py catalog.json --check-downloads
          python scripts/validate_telemetry.py telemetry.json
      - name: Reject private and generated residue
        shell: bash
        run: |
          set -euo pipefail
          if find . -path ./.git -prune -o -type f \( -name '*.env' -o -name '*.key' -o -name '*.pem' -o -name '*.log' -o -name '*.pyc' \) -print | grep -q .; then
            echo "Forbidden public artifact found"
            exit 1
          fi
          if grep -RIE --exclude-dir=.git --exclude='*.woff2' --exclude='verify-pages.yml' '(ghp_|github_pat_|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|C:\\Users\\)' .; then
            echo "Secret or private path marker found"
            exit 1
          fi
